name: JOSS paper
on:
  push:
    paths: ['paper/**', '.github/workflows/paper.yml']
  pull_request:
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with official Open Journals tooling
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: paper/paper.pdf
